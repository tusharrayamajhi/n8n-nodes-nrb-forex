# Manually-triggered release: bumps the version, updates the changelog, tags,
# pushes, creates a GitHub release, and publishes to npm with provenance —
# entirely inside GitHub Actions, no local `npm run release` needed.
#
# A tag pushed with the default GITHUB_TOKEN does NOT trigger other workflows
# (GitHub disables that to prevent recursive runs), so this workflow does the
# npm publish itself in the same job rather than relying on publish.yml to
# pick up the new tag.
#
# Run it from the Actions tab ("Release" workflow → "Run workflow"), or via:
#   gh workflow run release.yml --repo tusharrayamajhi/n8n-nodes-nrb-forex -f bump=patch

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  release:
    name: Bump, tag, and publish
    runs-on: ubuntu-latest

    permissions:
      # Required to push the version-bump commit/tag and create a GitHub release.
      contents: write
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, changelog, tag, and push
        run: |
          npx release-it ${{ inputs.bump }} \
            -n \
            --git.requireBranch=main \
            --git.requireCleanWorkingDir \
            --git.requireUpstream \
            --git.requireCommits \
            --git.commit \
            --git.tag \
            --git.push \
            --git.changelog="npx auto-changelog --stdout --unreleased --commit-limit false -u --hide-credit" \
            --github.release \
            --hooks.before:init="npm run lint && npm run build" \
            --hooks.after:bump="npx auto-changelog -p" \
            --npm.publish=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        # Reuses `n8n-node release`'s own CI-mode logic (lint, build, then
        # `npm publish` with provenance) — it detects GITHUB_ACTIONS
        # automatically and takes that path instead of the local bump flow.
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
